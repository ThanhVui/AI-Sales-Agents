name: CI/CD Pipeline - Synexan AI Sales Real Estate

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright System Browsers
        run: |
          playwright install --with-deps chromium

      - name: Syntax & Import Verification
        run: |
          python -c "
          import src.config
          import src.ai
          import src.automation
          import src.database
          import src.queue
          import src.web
          print('All modules imported successfully!')
          "

      - name: Trigger Render Deploy Hook (Optional)
        if: github.ref == 'refs/heads/main' && env.RENDER_DEPLOY_HOOK_URL != ''
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl -X POST "$RENDER_DEPLOY_HOOK_URL"

